<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURE VANILLA 3D ARENA</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #00ffcc; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #8b949e; margin-bottom: 1.5rem; }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: #000;
            border: 2px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background-color: #00ffcc;
        }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }
        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        #instructions h2 { color: #39d353; margin-bottom: 1rem; text-transform: uppercase; }
        .ui-panel {
            margin-top: 1rem;
            width: 800px;
            display: flex;
            justify-content: space-between;
            color: #8b949e;
        }
        .score-box { color: #39d353; font-weight: bold; }
    </style>
</head>
<body>

    <h1>3D Local Engine Room</h1>
    <p>Zero external connections. 100% client-side core mathematical vector projection layout.</p>

    <div id="canvas-container">
        <div id="crosshair"></div>
        <div id="instructions" onclick="clickToPlay()">
            <h2>CLICK TO START GAME</h2>
            <p>Move: W, A, S, D | Look: Mouse | Shoot: Left Click</p>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div class="ui-panel">
        <div>Cubes Eliminated: <span id="score" class="score-box">0</span></div>
        <div>Engine Status: <span style="color:#00ffcc;">Pure Canvas3D Active</span></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const instructions = document.getElementById('instructions');

        // Game State Variables
        let pX = 0, pZ = 0, pYaw = 0; 
        let keys = { w: false, a: false, s: false, d: false };
        let targets = [];
        let score = 0;
        let isPlaying = false;

        // Initialize 3D Vector Targets straight ahead
        function initGame() {
            targets = [];
            for (let i = 0; i < 8; i++) {
                spawnCube();
            }
        }

        function spawnCube() {
            targets.push({
                x: (Math.random() - 0.5) * 30,
                z: -(Math.random() * 25 + 10),
                size: 2,
                color: '#39d353'
            });
        }

        // Input Handlers
        function clickToPlay() {
            isPlaying = true;
            instructions.style.display = 'none';
            container.requestPointerLock();
        }

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== container) {
                instructions.style.display = 'flex';
                isPlaying = false;
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === container) {
                pYaw -= e.movementX * 0.003;
            }
        });

        window.addEventListener('mousedown', () => {
            if (document.pointerLockElement !== container) return;
            
            // Check crosshair collision with target centers
            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                // Translate
                let rotX = (t.x - pX) * Math.cos(pYaw) - (t.z - pZ) * Math.sin(pYaw);
                let rotZ = (t.x - pX) * Math.sin(pYaw) + (t.z - pZ) * Math.cos(pYaw);

                if (rotZ < 0) {
                    let screenX = 400 + (rotX / -rotZ) * 400;
                    // Check if center screen crosshair matches target boundaries
                    if (Math.abs(screenX - 400) < (t.size / -rotZ) * 400) {
                        targets.splice(i, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        spawnCube();
                        break;
                    }
                }
            }
        });

        // 3D Engine Frame Loop Process
        function loop() {
            // Processing movements
            let speed = 0.15;
            if (keys.w) { pX -= Math.sin(pYaw) * speed; pZ += Math.cos(pYaw) * speed; }
            if (keys.s) { pX += Math.sin(pYaw) * speed; pZ -= Math.cos(pYaw) * speed; }
            if (keys.a) { pX -= Math.cos(pYaw) * speed; pZ -= Math.sin(pYaw) * speed; }
            if (keys.d) { pX += Math.cos(pYaw) * speed; pZ += Math.sin(pYaw) * speed; }

            // Clear Screen Frame
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(0, 0, 800, 500);

            // Draw Wireframe Floor Lines
            ctx.strokeStyle = '#21262d';
            ctx.lineWidth = 1;
            for (let i = -50; i <= 50; i += 5) {
                drawWorldLine(i, 0, -50, i, 0, 50);
                drawWorldLine(-50, 0, i, 50, 0, i);
            }

            // Draw Core 3D Objects
            targets.forEach(t => {
                // Render matrix coordinates transformation
                let rotX = (t.x - pX) * Math.cos(pYaw) - (t.z - pZ) * Math.sin(pYaw);
                let rotZ = (t.x - pX) * Math.sin(pYaw) + (t.z - pZ) * Math.cos(pYaw);

                if (rotZ < -1) {
                    let sz = (t.size / -rotZ) * 400;
                    let sx = 400 + (rotX / -rotZ) * 400;
                    let sy = 250;

                    // Rendering Solid Object Layer
                    ctx.fillStyle = t.color;
                    ctx.fillRect(sx - sz/2, sy - sz, sz, sz * 2);
                    
                    // Highlight Borders
                    ctx.strokeStyle = '#00ffcc';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx - sz/2, sy - sz, sz, sz * 2);
                }
            });

            requestAnimationFrame(loop);
        }

        function drawWorldLine(x1, y1, z1, x2, y2, z2) {
            let rx1 = (x1 - pX) * Math.cos(pYaw) - (z1 - pZ) * Math.sin(pYaw);
            let rz1 = (x1 - pX) * Math.sin(pYaw) + (z1 - pZ) * Math.cos(pYaw);
            let rx2 = (x2 - pX) * Math.cos(pYaw) - (z2 - pZ) * Math.sin(pYaw);
            let rz2 = (x2 - pX) * Math.sin(pYaw) + (z2 - pZ) * Math.cos(pYaw);

            if (rz1 < -1 && rz2 < -1) {
                let sx1 = 400 + (rx1 / -rz1) * 400;
                let sy1 = 250 + (y1 / -rz1) * 400;
                let sx2 = 400 + (rx2 / -rz2) * 400;
                let sy2 = 250 + (y2 / -rz2) * 400;

                ctx.beginPath();
                ctx.moveTo(sx1, sy1);
                ctx.lineTo(sx2, sy2);
                ctx.stroke();
            }
        }

        // Initialize Core System Execution Loops
        initGame();
        loop();
    </script>
</body>
</html>
