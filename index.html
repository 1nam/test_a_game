<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D LOCAL ARCARE ROOM // LIVE</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-cyan: #00ffcc;
            --accent-green: #39d353;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: monospace;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-cyan);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        #canvas-container {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: #000;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: var(--accent-cyan);
        }

        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        #instructions h2 {
            color: var(--accent-green);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ui-panel {
            margin-top: 1rem;
            width: 800px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .score-box {
            color: var(--accent-green);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>3D Local Engine Room</h1>
    <p>Zero external frame mirrors or tracking signatures. Pure localized client-side math array logic.</p>

    <div id="canvas-container">
        <div id="crosshair"></div>
        <div id="instructions" onclick="clickToPlay()">
            <h2>CLICK TO START GAME</h2>
            <p>Move: W, A, S, D | Look: Mouse Aim | Shoot: Left Click</p>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div class="ui-panel">
        <div>Cubes Eliminated: <span id="score" class="score-box">0</span></div>
        <div>Engine Status: <span style="color: var(--accent-cyan);">Pure Canvas3D Vector Projection Active</span></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const instructions = document.getElementById('instructions');

        // Core 3D Transformation Math Coordinates
        let pX = 0, pZ = 0, pYaw = 0; 
        let keys = { w: false, a: false, s: false, d: false };
        let targets = [];
        let score = 0;
        let isPlaying = false;

        function initGame() {
            targets = [];
            for (let i = 0; i < 8; i++) {
                spawnCube();
            }
        }

        function spawnCube() {
            targets.push({
                x: (Math.random() - 0.5) * 30,
                z: -(Math.random() * 25 + 10),
                size: 2,
                color: '#39d353'
            });
        }

        // Input Lock Framework Actions
        function clickToPlay() {
            isPlaying = true;
            instructions.style.display = 'none';
            container.requestPointerLock();
        }

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== container) {
                instructions.style.display = 'flex';
                isPlaying = false;
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === container) {
                pYaw -= e.movementX * 0.003;
            }
        });

        window.addEventListener('mousedown', () => {
            if (document.pointerLockElement !== container) return;
            
            // Core Target intersection collision detector checks
            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                let rotX = (t.x - pX) * Math.cos(pYaw) - (t.z - pZ) * Math.sin(pYaw);
                let rotZ = (t.x - pX) * Math.sin(pYaw) + (t.z - pZ) * Math.cos(pYaw);

                if (rotZ < 0) {
                    let screenX = 400 + (rotX / -rotZ) * 400;
                    if (Math.abs(screenX - 400) < (t.size / -rotZ) * 400) {
                        targets.splice(i, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        spawnCube();
                        break;
                    }
                }
            }
        });

        function projectPoint(x, y, z) {
            let rotX = (x - pX) * Math.cos(pYaw) - (z - pZ) * Math.sin(pYaw);
            let rotZ = (x - pX) * Math.sin(pYaw) + (z - pZ) * Math.cos(pYaw);
            if (rotZ >= -0.5) return null; 
            return {
                x: 400 + (rotX / -rotZ) * 400,
                y: 250 + (y / -rotZ) * 400,
                depth: rotZ
            };
        }

        function drawFace(p1, p2, p3, p4, color, strokeColor) {
            if (!p1 || !p2 || !p3 || !p4) return;
            ctx.fillStyle = color;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function drawWorldLine(x1, y1, z1, x2, y2, z2) {
            let p1 = projectPoint(x1, y1, z1);
            let p2 = projectPoint(x2, y2, z2);

            if (p1 && p2) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }

        // Live Realtime Frame Refresh Logic Updates
        function loop() {
            // Speed adjustments. Forward / Backward physics fixes applied natively
            let speed = 0.15;
            if (keys.w) { pX += Math.sin(pYaw) * speed; pZ -= Math.cos(pYaw) * speed; }
            if (keys.s) { pX -= Math.sin(pYaw) * speed; pZ += Math.cos(pYaw) * speed; }
            if (keys.a) { pX -= Math.cos(pYaw) * speed; pZ -= Math.sin(pYaw) * speed; }
            if (keys.d) { pX += Math.cos(pYaw) * speed; pZ += Math.sin(pYaw) * speed; }

            // Clear Viewport Buffer
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(0, 0, 800, 500);

            // Draw World Ground Mapping Vectors
            ctx.strokeStyle = '#21262d';
            ctx.lineWidth = 1;
            for (let i = -50; i <= 50; i += 5) {
                drawWorldLine(i, 0, -50, i, 0, 50);
                drawWorldLine(-50, 0, i, 50, 0, i);
            }

            // Depth index sorter organizes overlapping canvas assets
            targets.sort((a, b) => {
                let distA = (a.x - pX)**2 + (a.z - pZ)**2;
                let distB = (b.x - pX)**2 + (b.z - pZ)**2;
                return distB - distA;
            });

            // Map and draw fully shaded geometric 3D target solid cubes
            targets.forEach(t => {
                let r = t.size / 2;
                
                let f1 = projectPoint(t.x - r,  r, t.z - r); 
                let f2 = projectPoint(t.x + r,  r, t.z - r); 
                let f3 = projectPoint(t.x + r, -r, t.z - r); 
                let f4 = projectPoint(t.x - r, -r, t.z - r); 
                
                let b1 = projectPoint(t.x - r,  r, t.z + r); 
                let b2 = projectPoint(t.x + r,  r, t.z + r); 
                let b3 = projectPoint(t.x + r, -r, t.z + r); 
                let b4 = projectPoint(t.x - r, -r, t.z + r); 

                let stroke = '#00ffcc';

                drawFace(b1, b2, b3, b4, '#1b5e20', stroke); 
                drawFace(f1, b1, b4, f4, '#2e7d32', stroke); 
                drawFace(f2, b2, b3, f3, '#2e7d32', stroke); 
                drawFace(f1, f2, b2, b1, '#4caf50', stroke); 
                drawFace(f4, f3, b3, b4, '#1b5e20', stroke); 
                drawFace(f1, f2, f3, f4, '#39d353', stroke); 
            });

            requestAnimationFrame(loop);
        }

        // Initialize Core Loops
        initGame();
        loop();
    </script>
</body>
</html>
