<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURE VANILLA 3D ARENA</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #00ffcc; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #8b949e; margin-bottom: 1.5rem; }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: #000;
            border: 2px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background-color: #00ffcc;
        }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }
        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        #instructions h2 { color: #39d353; margin-bottom: 1rem; text-transform: uppercase; }
        .ui-panel {
            margin-top: 1rem;
            width: 800px;
            display: flex;
            justify-content: space-between;
            color: #8b949e;
        }
        .score-box { color: #39d353; font-weight: bold; }
    </style>
</head>
<body>

    <h1>3D Local Engine Room</h1>
    <p>Zero external connections. 100% client-side core mathematical vector projection layout.</p>

    <div id="canvas-container">
        <div id="crosshair"></div>
        <div id="instructions" onclick="clickToPlay()">
            <h2>CLICK TO START GAME</h2>
            <p>Move: W, A, S, D | Look: Mouse | Shoot: Left Click</p>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div class="ui-panel">
        <div>Cubes Eliminated: <span id="score" class="score-box">0</span></div>
        <div>Engine Status: <span style="color:#00ffcc;">Pure Canvas3D Active</span></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const instructions = document.getElementById('instructions');

        // Game State Variables
        let pX = 0, pZ = 0, pYaw = 0; 
        let keys = { w: false, a: false, s: false, d: false };
        let targets = [];
        let score = 0;
        let isPlaying = false;

        // Initialize 3D Vector Targets straight ahead
        function initGame() {
            targets = [];
            for (let i = 0; i < 8; i++) {
                spawnCube();
            }
        }

        function spawnCube() {
            targets.push({
                x: (Math.random() - 0.5) * 30,
                z: -(Math.random() * 25 + 10),
                size: 2,
                color: '#39d353'
            });
        }

        // Input Handlers
        function clickToPlay() {
            isPlaying = true;
            instructions.style.display = 'none';
            container.requestPointerLock();
        }

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== container) {
                instructions.style.display = 'flex';
                isPlaying = false;
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === container) {
                pYaw -= e.movementX * 0.003;
            }
        });

        window.addEventListener('mousedown', () => {
            if (document.pointerLockElement !== container) return;
            
            // Check crosshair collision with target centers
            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                let rotX = (t.x - pX) * Math.cos(pYaw) - (t.z - pZ) * Math.sin(pYaw);
                let rotZ = (t.x - pX) * Math.sin(pYaw) + (t.z - pZ) * Math.cos(pYaw);

                if (rotZ < 0) {
                    let screenX = 400 + (rotX / -rotZ) * 400;
                    if (Math.abs(screenX - 400) < (t.size / -rotZ) * 400) {
                        targets.splice(i, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        spawnCube();
                        break;
                    }
                }
            }
        });

        // Helper to project and track 3D points down to a 2D viewport
        function projectPoint(x, y, z) {
            let rotX = (x - pX) * Math.cos(pYaw) - (z - pZ) * Math.sin(pYaw);
            let rotZ = (x - pX) * Math.sin(pYaw) + (z - pZ) * Math.cos(pYaw);
            if (rotZ >= -0.5) return null; // Behind camera protection
            return {
                x: 400 + (rotX / -rotZ) * 400,
                y: 250 + (y / -rotZ) * 400,
                depth: rotZ
            };
        }

        // Draws a real 3D solid cube side panel layout face matrix
        function drawFace(p1, p2, p3, p4, color, strokeColor) {
            if (!p1 || !p2 || !p3 || !p4) return;
            ctx.fillStyle = color;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // 3D Engine Frame Loop Process
        function loop() {
            // Processing movements (W and S swapped back cleanly here)
            let speed = 0.15;
            if (keys.w) { pX += Math.sin(pYaw) * speed; pZ -= Math.cos(pYaw) * speed; }
            if (keys.s) { pX -= Math.sin(pYaw) * speed; pZ += Math.cos(pYaw) * speed; }
            if (keys.a) { pX -= Math.cos(pYaw) * speed; pZ -= Math.sin(pYaw) * speed; }
            if (keys.d) { pX += Math.cos(pYaw) * speed; pZ += Math.sin(pYaw) * speed; }

            // Clear Screen Frame
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(0, 0, 800, 500);

            // Draw Wireframe Floor Lines
            ctx.strokeStyle = '#21262d';
            ctx.lineWidth = 1;
            for (let i = -50; i <= 50; i += 5) {
                drawWorldLine(i, 0, -50, i, 0, 50);
                drawWorldLine(-50, 0, i, 50, 0, i);
            }

            // Sort targets by depth so things further away render behind close things
            targets.sort((a, b) => {
                let distA = (a.x - pX)**2 + (a.z - pZ)**2;
                let distB = (b.x - pX)**2 + (b.z - pZ)**2;
                return distB - distA;
            });

            // Draw Targets as Actual Solid 3D Boxes with Depth
            targets.forEach(t => {
                let r = t.size / 2;
                
                // Track 8 corner vector calculations of the 3D box
                let f1 = projectPoint(t.x - r,  r, t.z - r); // Front Upper Left
                let f2 = projectPoint(t.x + r,  r, t.z - r); // Front Upper Right
                let f3 = projectPoint(t.x + r, -r, t.z - r); // Front Lower Right
                let f4 = projectPoint(t.x - r, -r, t.z - r); // Front Lower Left
                
                let b1 = projectPoint(t.x - r,  r, t.z + r); // Back Upper Left
                let b2 = projectPoint(t.x + r,  r, t.z + r); // Back Upper Right
                let b3 = projectPoint(t.x + r, -r, t.z + r); // Back Lower Right
                let b4 = projectPoint(t.x - r, -r, t.z + r); // Back Lower Left

                let stroke = '#00ffcc';

                // Render back wall faces first, then wrap up layers forward
                drawFace(b1, b2, b3, b4, '#1b5e20', stroke); // Back Face
                drawFace(f1, b1, b4, f4, '#2e7d32', stroke); // Left Face
                drawFace(f2, b2, b3, f3, '#2e7d32', stroke); // Right Face
                drawFace(f1, f2, b2, b1, '#4caf50', stroke); // Top Face
                drawFace(f4, f3, b3, b4, '#1b5e20', stroke); // Bottom Face
                drawFace(f1, f2, f3, f4, '#39d353', stroke); // Front Face Face
            });

            requestAnimationFrame(loop);
        }

        function drawWorldLine(x1, y1, z1, x2, y2, z2) {
            let p1 = projectPoint(x1, y1, z1);
            let p2 = projectPoint(x2, y2, z2);

            if (p1 && p2) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
