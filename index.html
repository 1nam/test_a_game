<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CYBER TOWN ARENA // LIVE</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-cyan: #00ffcc;
            --accent-green: #39d353;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: monospace;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { color: var(--accent-cyan); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px; }
        p { color: var(--text-muted); margin-bottom: 1.5rem; }

        #canvas-container {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: #000;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        canvas { width: 100%; height: 100%; display: block; }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background-color: var(--accent-cyan);
        }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        #instructions h2 { color: var(--accent-green); margin-bottom: 1rem; text-transform: uppercase; }

        .ui-panel {
            margin-top: 1rem;
            width: 800px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }
        .score-box { color: var(--accent-green); font-weight: bold; }
    </style>
</head>
<body>

    <h1>3D Low-Poly Town Arena</h1>
    <p>100% self-contained untextured town architecture, composite NPCs, and secure vector tracking.</p>

    <div id="canvas-container">
        <div id="crosshair"></div>
        <div id="instructions" onclick="clickToPlay()">
            <h2>CLICK TO ENTER TOWN</h2>
            <p>Move: W, A, S, D | Look: Mouse | Shoot: Left Click</p>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div class="ui-panel">
        <div>Droids Deactivated: <span id="score" class="score-box">0</span></div>
        <div>Engine Status: <span style="color: var(--accent-cyan);">Solid Plane + Buildings Processing Active</span></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const instructions = document.getElementById('instructions');

        let pX = 0, pY = 2, pZ = 5, pYaw = 0; 
        let keys = { w: false, a: false, s: false, d: false };
        let targets = [];
        let buildings = [];
        let score = 0;

        const phrases = [
            "Beep Boop! Do not shoot!",
            "Intruder alert!",
            "Error: 404 Target Found",
            "Stop right there!",
            "Scanning area...",
            "System online."
        ];

        function initGame() {
            targets = [];
            buildings = [];

            let bConfigs = [
                {x: -12, z: -15, w: 6, h: 12, d: 6},
                {x: 12, z: -18, w: 5, h: 10, d: 5},
                {x: -15, z: -35, w: 8, h: 16, d: 8},
                {x: 15, z: -30, w: 7, h: 14, d: 7},
                {x: -8, z: -50, w: 6, h: 10, d: 6},
                {x: 8, z: -55, w: 5, h: 12, d: 5},
                {x: -25, z: -20, w: 6, h: 8, d: 6},
                {x: 25, z: -25, w: 6, h: 9, d: 6}
            ];

            bConfigs.forEach(b => {
                buildings.push({ x: b.x, y: b.h/2, z: b.z, w: b.w, h: b.h, d: b.d });
            });

            for (let i = 0; i < 6; i++) { 
                spawnDroid(); 
            }
        }

        function spawnDroid() {
            targets.push({
                x: (Math.random() - 0.5) * 20,
                z: -(Math.random() * 30 + 10),
                w: 1.5,
                h: 2.5,
                d: 1.5,
                color: '#2e7d32',
                phrase: phrases[Math.floor(Math.random() * phrases.length)],
                phraseTimer: Math.random() * 100
            });
        }

        function clickToPlay() {
            instructions.style.display = 'none';
            container.requestPointerLock();
        }

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== container) {
                instructions.style.display = 'flex';
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === container) { pYaw -= e.movementX * 0.003; }
        });

        window.addEventListener('mousedown', () => {
            if (document.pointerLockElement !== container) return;
            
            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                let rotX = (t.x - pX) * Math.cos(pYaw) - (t.z - pZ) * Math.sin(pYaw);
                let rotZ = (t.x - pX) * Math.sin(pYaw) + (t.z - pZ) * Math.cos(pYaw);

                if (rotZ < 0) {
                    let screenX = 400 + (rotX / -rotZ) * 400;
                    let targetSizeOnScreen = (t.w / -rotZ) * 400;
                    if (Math.abs(screenX - 400) < targetSizeOnScreen) {
                        targets.splice(i, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        spawnDroid();
                        break;
                    }
                }
            }
        });

        function projectPoint(x, y, z) {
            let rotX = (x - pX) * Math.cos(pYaw) - (z - pZ) * Math.sin(pYaw);
            let rotZ = (x - pX) * Math.sin(pYaw) + (z - pZ) * Math.cos(pYaw);
            let rotY = y - pY;
            if (rotZ >= -0.2) return null; 
            return {
                x: 400 + (rotX / -rotZ) * 400,
                y: 250 + (rotY / -rotZ) * 400,
                depth: rotZ
            };
        }

        function drawFace(p1, p2, p3, p4, color, strokeColor) {
            if (!p1 || !p2 || !p3 || !p4) return;
            ctx.fillStyle = color;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function renderSolidBox(x, y, z, w, h, d, fillColors, strokeColor) {
            let xw = w / 2, yh = h / 2, zd = d / 2;

            let f1 = projectPoint(x - xw, y + yh, z - zd);
            let f2 = projectPoint(x + xw, y + yh, z - zd);
            let f3 = projectPoint(x + xw, y - yh, z - zd);
            let f4 = projectPoint(x - xw, y - yh, z - zd);

            let b1 = projectPoint(x - xw, y + yh, z + zd);
            let b2 = projectPoint(x + xw, y + yh, z + zd);
            let b3 = projectPoint(x + xw, y - yh, z + zd);
            let b4 = projectPoint(x - xw, y - yh, z + zd);

            drawFace(b1, b2, b3, b4, fillColors.back || fillColors.main, strokeColor);
            drawFace(f1, b1, b4, f4, fillColors.left || fillColors.main, strokeColor);
            drawFace(f2, b2, b3, f3, fillColors.right || fillColors.main, strokeColor);
            drawFace(f1, f2, b2, b1, fillColors.top || fillColors.main, strokeColor);
            drawFace(f4, f3, b3, b4, fillColors.bottom || fillColors.main, strokeColor);
            drawFace(f1, f2, f3, f4, fillColors.front || fillColors.main, strokeColor);
        }

        function loop() {
            let speed = 0.15;
            if (keys.w) { pX += Math.sin(pYaw) * speed; pZ -= Math.cos(pYaw) * speed; }
            if (keys.s) { pX -= Math.sin(pYaw) * speed; pZ += Math.cos(pYaw) * speed; }
            if (keys.a) { pX -= Math.cos(pYaw) * speed; pZ -= Math.sin(pYaw) * speed; }
            if (keys.d) { pX += Math.cos(pYaw) * speed; pZ += Math.sin(pYaw) * speed; }

            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(0, 0, 800, 500);

            ctx.fillStyle = '#161b22';
            ctx.fillRect(0, 250, 800, 250); 

            ctx.strokeStyle = '#21262d';
            ctx.lineWidth = 1;
            for (let i = -60; i <= 60; i += 4) {
                let p1 = projectPoint(i, 0, -60);
                let p2 = projectPoint(i, 0, 60);
                if (p1 && p2) { ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }

                let p3 = projectPoint(-60, 0, i);
                let p4 = projectPoint(60, 0, i);
                if (p3 && p4) { ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke(); }
            }

            let renderList = [];
            
            buildings.forEach(b => {
                let dist = (b.x - pX)**2 + (b.z - pZ)**2;
                renderList.push({ type: 'building', data: b, dist: dist });
            });

            targets.forEach(t => {
                let dist = (t.x - pX)**2 + (t.z - pZ)**2;
                renderList.push({ type: 'droid', data: t, dist: dist });
            });

            renderList.sort((a, b) => b.dist - a.dist);

            renderList.forEach(item => {
                if (item.type === 'building') {
                    let b = item.data;
                    renderSolidBox(b.x, b.y, b.z, b.w, b.h, b.d, {
                        main: '#2d333b', top: '#3c444d', front: '#2d333b', left: '#22272e', right: '#22272e'
                    }, '#444c56');
                } 
                else if (item.type === 'droid') {
                    let t = item.data;
                    
                    let bodyY = t.h / 2; 
                    renderSolidBox(t.x, bodyY, t.z, t.w, t.h, t.d, {
                        main: '#2e7d32', top: '#4caf50', front: '#39d353'
                    }, '#00ffcc');

                    let sphereRadiusVal = 0.4;
                    let headY = t.h + sphereRadiusVal; 
                    let headCenter = projectPoint(t.x, headY, t.z);

                    if (headCenter) {
                        let sRadiusOnScreen = (sphereRadiusVal / -headCenter.depth) * 400;

                        if (sRadiusOnScreen > 1) {
                            ctx.beginPath();
                            ctx.arc(headCenter.x, headCenter.y, sRadiusOnScreen, 0, 2 * Math.PI);
                            ctx.fillStyle = '#00ffcc';
                            ctx.fill();
                            ctx.strokeStyle = '#ffffff';
                            ctx.lineWidth = 1;
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.arc(headCenter.x, headCenter.y, sRadiusOnScreen * 0.3, 0, 2 * Math.PI);
                            ctx.fillStyle = '#ff3366';
                            ctx.fill();
                        }
                    }

                    t.phraseTimer += 0.5;
                    if (Math.sin(t.phraseTimer / 15) > 0.3) {
                        let textPos = projectPoint(t.x, headY + 0.8, t.z);
                        if (textPos) {
                            ctx.font = 'bold 11px monospace';
                            ctx.fillStyle = '#ffffff';
                            ctx.textAlign = 'center';
                            
                            let textWidth = ctx.measureText(t.phrase).width;
                            ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
                            ctx.fillRect(textPos.x - textWidth/2 - 6, textPos.y - 12, textWidth + 12, 18);
                            ctx.strokeStyle = '#00ffcc';
                            ctx.strokeRect(textPos.x - textWidth/2 - 6, textPos.y - 12, textWidth + 12, 18);
                            
                            ctx.fillStyle = '#00ffcc';
                            ctx.fillText(t.phrase, textPos.x, textPos.y);
                        }
                    }
                }
            });

            requestAnimationFrame(loop);
        }

        initGame();
        loop();
    </script>
</body>
</html>
