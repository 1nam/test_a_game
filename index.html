<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D OPEN SOURCE WEB ARENA</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #00ffcc; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #8b949e; margin-bottom: 1.5rem; }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: #000;
            border: 2px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background-color: #00ffcc;
        }
        #crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
        #crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }
        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        #instructions h2 { color: #39d353; }
        .score-box { color: #39d353; font-weight: bold; }
    </style>
    <!-- Imports the official, open-source 3D layout processor directly -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h1>3D Browser Arcade Room</h1>
    <p>No dead frame references. Code processes natively inside your local web page context.</p>

    <div id="canvas-container">
        <div id="crosshair"></div>
        <div id="instructions" onclick="lockPointer()">
            <h2>CLICK HERE TO PLAY</h2>
            <p>W, A, S, D to Move | Mouse to Look Around | Click to Shoot Green Targets</p>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div style="margin-top: 1rem; width: 800px; display: flex; justify-content: space-between;">
        <div>Targets Defeated: <span id="score" class="score-box">0</span></div>
        <div>System Engine: <span style="color:#00ffcc;">Active (WebGL)</span></div>
    </div>

    <script>
        let scene, camera, renderer, moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let targets = [], score = 0;

        const container = document.getElementById('canvas-container');
        const instructions = document.getElementById('instructions');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);

            camera = new THREE.PerspectiveCamera(75, 800 / 500, 0.1, 1000);
            camera.position.y = 2;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8);
            dirLight.position.set(1, 1, 1).normalize();
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(100, 50, 0x30363d, 0x21262d);
            scene.add(gridHelper);

            for(let i=0; i<10; i++) { spawnTarget(); }

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(800, 500);

            document.addEventListener('keydown', (e) => handleKey(e, true));
            document.addEventListener('keyup', (e) => handleKey(e, false));
            document.addEventListener('mousemove', handleAim);
            window.addEventListener('click', handleFire);

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === container) {
                    instructions.style.display = 'none';
                } else {
                    instructions.style.display = 'flex';
                }
            });

            animate();
        }

        function spawnTarget() {
            const geo = new THREE.BoxGeometry(2, 4, 2);
            const mat = new THREE.MeshLambertMaterial({ color: 0x39d353 });
            const box = new THREE.Mesh(geo, mat);
            box.position.set((Math.random() - 0.5) * 50, 2, (Math.random() - 0.5) * 50);
            scene.add(box);
            targets.push(box);
        }

        function lockPointer() { container.requestPointerLock(); }

        function handleAim(e) {
            if (document.pointerLockElement !== container) return;
            camera.rotation.y -= e.movementX * 0.0025;
            camera.rotation.x -= e.movementY * 0.0025;
            camera.rotation.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, camera.rotation.x));
        }

        function handleKey(e, isDown) {
            if (e.code === 'KeyW') moveForward = isDown;
            if (e.code === 'KeyS') moveBackward = isDown;
            if (e.code === 'KeyA') moveLeft = isDown;
            if (e.code === 'KeyD') moveRight = isDown;
        }

        function handleFire() {
            if (document.pointerLockElement !== container) return;
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(targets);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                scene.remove(hit);
                targets = targets.filter(t => t !== hit);
                score++;
                document.getElementById('score').innerText = score;
                spawnTarget();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (document.pointerLockElement === container) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y = 2;
                prevTime = time;
            }
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
